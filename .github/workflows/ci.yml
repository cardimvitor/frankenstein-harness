name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

# a newer push cancels the older run of the same branch: hung or superseded runs stop costing minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows minutes are billed at a multiple: on pushes they run only for commits whose message contains
        # [ci-full] (always for pull requests, manual runs and main)
        os: ${{ fromJSON((github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[ci-full]')) && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    # Windows is a target platform but the integration suites still shell out to POSIX `sh` and `python3`: report, do not block.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - if: matrix.os != 'windows-latest'
        run: cargo test --release
      # Windows: run every integration test file on its own with a time limit, so a hang names the file instead of
      # stalling the job, and print what failed. (Tests that need POSIX tools skip themselves or are being ported.)
      - if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 40
        run: |
          cargo test --lib
          $failed = @()
          foreach ($f in Get-ChildItem tests/*.rs) {
            $n = $f.BaseName
            $out = "out_$n.txt"; $err = "err_$n.txt"
            $p = Start-Process cargo -ArgumentList "test --test $n -- --test-threads=4" -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
            if (-not $p.WaitForExit(300000)) { taskkill /PID $p.Id /T /F | Out-Null; $failed += "$n (timeout)"; Write-Host "=== $n: TIMEOUT" }
            elseif ($p.ExitCode -ne 0) { $failed += $n; Write-Host "=== $n: FAILED" }
            else { Write-Host "=== $n: ok" }
            Get-Content $out -ErrorAction SilentlyContinue | Select-String -Pattern '^test |test result|panicked|^\[' | ForEach-Object { $_.Line }
            if ($p.ExitCode -ne 0) { Get-Content $err -Tail 40 -ErrorAction SilentlyContinue }
          }
          if ($failed.Count -gt 0) { Write-Host "FAILED: $($failed -join ', ')"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: fh-${{ matrix.os }}
          path: |
            target/release/fh
            target/release/fh.exe
          if-no-files-found: ignore
