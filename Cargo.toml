[package]
name = "frankenstein-harness"
version = "0.1.0"
edition = "2021"
description = "Native coding-agent harness for Qwen on vLLM (MTP): verify-before-output, hidden skill store, master/worker orchestration."
license = "MIT"
rust-version = "1.86"

[lib]
name = "fh"
path = "src/lib.rs"

[[bin]]
name = "fh"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs", "io-util", "signal", "net"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
axum = "0.7"
async-trait = "0.1"
anyhow = "1"
libc = "0.2"
ratatui = "0.30"
tempfile = "3"
url = "2"




[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
